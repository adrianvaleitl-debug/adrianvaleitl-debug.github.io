name: Feature request
description: Suggest an improvement for the Adrian Vale portfolio.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Explain the feature or improvement.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why would it be useful?
    validations:
      required: true
