name: Website bug report
description: Report a problem with the Adrian Vale portfolio website.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve the portfolio. Please include enough detail to reproduce the issue."
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: "e.g. Projects section"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "e.g. Chrome on Windows 11"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
